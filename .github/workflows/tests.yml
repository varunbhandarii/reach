name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install system libraries for OpenCV and PortAudio
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libportaudio2
      - run: uv python install
      - run: uv sync --locked
      - run: uv run pytest -q
