<text x="326" y="102" font-size="20" font-weight="700" fill="#0072B2">Laptop (Windows or macOS), all local</text>
<rect x="1200" y="70" width="370" height="800" rx="14" fill="#F2F4F7" stroke="#D55E00" stroke-width="2"/>
<text x="1216" y="102" font-size="20" font-weight="700" fill="#D55E00">Meta Model API</text>
