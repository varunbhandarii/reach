<polyline points="840.9,500.0 956.4,600.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<rect x="50" y="130" width="210" height="120" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
<rect x="50" y="130" width="8" height="120" rx="3" fill="#009E73"/>
<text x="70" y="160" font-size="20" font-weight="700" fill="#101418">Phone camera</text>
<text x="70" y="186" font-size="16" fill="#4A5562">held in one hand</text>
<text x="70" y="208" font-size="16" fill="#4A5562">640×480, about 29 fps</text>
<text x="70" y="230" font-size="16" fill="#4A5562">~125 ms to the laptop</text>
<rect x="50" y="380" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
<rect x="50" y="380" width="8" height="100" rx="3" fill="#009E73"/>
<text x="70" y="410" font-size="20" font-weight="700" fill="#101418">Microphone</text>
<text x="70" y="436" font-size="16" fill="#4A5562">laptop mic</text>
<text x="70" y="458" font-size="16" fill="#4A5562">streamed at 24 kHz</text>
<rect x="50" y="600" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2.5"/>
<rect x="50" y="600" width="8" height="110" rx="3" fill="#009E73"/>
<text x="70" y="630" font-size="20" font-weight="700" fill="#101418">Headphones</text>
<text x="70" y="656" font-size="16" fill="#4A5562">stereo guide sound</text>
<text x="70" y="678" font-size="16" fill="#4A5562">earcons and speech</text>
<rect x="330" y="130" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="330" y="130" width="8" height="120" rx="3" fill="#0072B2"/>
<text x="350" y="160" font-size="20" font-weight="700" fill="#101418">Capture</text>
<text x="350" y="186" font-size="16" fill="#4A5562">newest-frame ring</text>
<text x="350" y="208" font-size="16" fill="#4A5562">reconnects a stalled</text>
<text x="350" y="230" font-size="16" fill="#4A5562">phone stream</text>
<rect x="610" y="130" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="610" y="130" width="8" height="120" rx="3" fill="#0072B2"/>
<text x="630" y="160" font-size="20" font-weight="700" fill="#101418">Hand tracking</text>
<text x="630" y="186" font-size="16" fill="#4A5562">MediaPipe landmarks</text>
<text x="630" y="208" font-size="16" fill="#4A5562">One Euro fingertip</text>
<text x="630" y="230" font-size="16" fill="#4A5562">p95 12 to 23 ms</text>
<rect x="890" y="130" width="260" height="120" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="890" y="130" width="8" height="120" rx="3" fill="#0072B2"/>
<text x="910" y="160" font-size="20" font-weight="700" fill="#101418">Target propagation</text>
<text x="910" y="186" font-size="16" fill="#4A5562">table homography,</text>
<text x="910" y="208" font-size="16" fill="#4A5562">hand masked out</text>
<text x="910" y="230" font-size="16" fill="#4A5562">p50 5 to 13 ms</text>
<rect x="330" y="370" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="330" y="370" width="8" height="120" rx="3" fill="#0072B2"/>
<text x="350" y="400" font-size="20" font-weight="700" fill="#101418">Voice client</text>
<text x="350" y="426" font-size="16" fill="#4A5562">endpointing stream</text>
<text x="350" y="448" font-size="16" fill="#4A5562">local grammar</text>
<text x="350" y="470" font-size="16" fill="#4A5562">speech end to command ~0.5 s</text>
<rect x="610" y="360" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="610" y="360" width="8" height="140" rx="3" fill="#0072B2"/>
<text x="630" y="390" font-size="20" font-weight="700" fill="#101418">Session state machine</text>
<text x="630" y="416" font-size="16" fill="#4A5562">deterministic, per hand frame</text>
<text x="630" y="438" font-size="16" fill="#4A5562">contact rule: inside, still,</text>
<text x="630" y="460" font-size="16" fill="#4A5562">mask overlap</text>
<text x="630" y="482" font-size="16" fill="#4A5562">every step logged</text>
<rect x="940" y="370" width="210" height="120" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="940" y="370" width="8" height="120" rx="3" fill="#0072B2"/>
<text x="960" y="400" font-size="20" font-weight="700" fill="#101418">Event log</text>
<text x="960" y="426" font-size="16" fill="#4A5562">exact replay of</text>
<text x="960" y="448" font-size="16" fill="#4A5562">every session</text>
<rect x="330" y="590" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="330" y="590" width="8" height="130" rx="3" fill="#0072B2"/>
<text x="350" y="620" font-size="20" font-weight="700" fill="#101418">Sound engine</text>
<text x="350" y="646" font-size="16" fill="#4A5562">pan: left or right</text>
<text x="350" y="668" font-size="16" fill="#4A5562">pitch: closer or farther</text>
<text x="350" y="690" font-size="16" fill="#4A5562">pulse: distance</text>
<text x="350" y="712" font-size="16" fill="#4A5562">48 kHz, 5 ms blocks</text>
<rect x="610" y="600" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="610" y="600" width="8" height="110" rx="3" fill="#0072B2"/>
<text x="630" y="630" font-size="20" font-weight="700" fill="#101418">Local speech</text>
<text x="630" y="656" font-size="16" fill="#4A5562">Windows SAPI or</text>
<text x="630" y="678" font-size="16" fill="#4A5562">macOS say, cached</text>
<text x="630" y="700" font-size="16" fill="#4A5562">starts in ~5 ms</text>
<rect x="890" y="600" width="260" height="110" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2.5"/>
<rect x="890" y="600" width="8" height="110" rx="3" fill="#0072B2"/>
<text x="910" y="630" font-size="20" font-weight="700" fill="#101418">Screen</text>
<text x="910" y="656" font-size="16" fill="#4A5562">camera view, captions,</text>
<text x="910" y="678" font-size="16" fill="#4A5562">sound and status</text>
<rect x="1220" y="130" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/>
<rect x="1220" y="130" width="8" height="140" rx="3" fill="#D55E00"/>
<text x="1240" y="160" font-size="20" font-weight="700" fill="#101418">SAM 3.1</text>
<text x="1240" y="186" font-size="16" fill="#4A5562">object from a noun phrase:</text>
<text x="1240" y="208" font-size="16" fill="#4A5562">boxes, masks, confidence</text>
<text x="1240" y="230" font-size="16" fill="#4A5562">p50 ~0.8 s, applied late</text>
<text x="1240" y="252" font-size="16" fill="#4A5562">without losing the hand</text>
<rect x="1220" y="360" width="330" height="140" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/>
<rect x="1220" y="360" width="8" height="140" rx="3" fill="#D55E00"/>
<text x="1240" y="390" font-size="20" font-weight="700" fill="#101418">Muse Voice Transcribe</text>
<text x="1240" y="416" font-size="16" fill="#4A5562">realtime endpointing</text>
<text x="1240" y="438" font-size="16" fill="#4A5562">keyword biasing</text>
<text x="1240" y="460" font-size="16" fill="#4A5562">natural requests via Spark</text>
<rect x="1220" y="590" width="330" height="160" rx="10" fill="#FFFFFF" stroke="#D55E00" stroke-width="2.5"/>
<rect x="1220" y="590" width="8" height="160" rx="3" fill="#D55E00"/>
<text x="1240" y="620" font-size="20" font-weight="700" fill="#101418">Muse Spark 1.3</text>
<text x="1240" y="646" font-size="16" fill="#4A5562">two-image touch check</text>
<text x="1240" y="668" font-size="16" fill="#4A5562">(before reach vs touch)</text>
<text x="1240" y="690" font-size="16" fill="#4A5562">what is on the table</text>
<text x="1240" y="712" font-size="16" fill="#4A5562">structured JSON, store off</text>
<text x="30" y="892" font-size="15" fill="#4A5562">Times are measured medians or 95th percentiles from our runs; the camera and SAM times dominate. Orange: Meta Model API. Blue: local. Green: devices.</text>
</svg>
