<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Atkinson Hyperlegible, Segoe UI, Arial, sans-serif">
<title>Reach architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6573"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="30" y="45" font-size="30" font-weight="700" fill="#101418">Reach: from a spoken request to a guided touch</text>
