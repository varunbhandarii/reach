<text x="295.0" y="182.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">frames</text>
<polyline points="580.0,190.0 610.0,190.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<polyline points="860.0,190.0 890.0,190.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<polyline points="1150.0,193.6 1220.0,195.5" fill="none" stroke="#5B6573" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<polyline points="260.0,430.0 330.0,430.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<text x="295.0" y="422.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">audio</text>
<polyline points="455.0,490.0 455.0,545.0 1185.0,545.0 1185.0,430.0 1220.0,430.0" fill="none" stroke="#5B6573" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="1035.0" y="537.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">speech out, text back</text>
<polyline points="741.2,250.0 752.7,360.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<text x="747.0" y="297.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">fingertip</text>
<polyline points="955.0,250.0 835.8,360.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<text x="895.4" y="297.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">target</text>
<polyline points="580.0,430.0 610.0,430.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<polyline points="910.0,430.0 940.0,430.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<polyline points="910.0,487.6 1220.0,606.6" fill="none" stroke="#5B6573" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="1185.0" y="580.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">touch check</text>
<polyline points="665.1,500.0 543.1,590.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<text x="604.1" y="537.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">cue</text>
<polyline points="752.2,500.0 741.1,600.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
<text x="746.7" y="542.0" font-size="14" text-anchor="middle" fill="#4A5562" paint-order="stroke" stroke="#F2F4F7" stroke-width="5">phrase</text>
<polyline points="610.0,655.0 580.0,655.0" fill="none" stroke="#5B6573" stroke-width="2" marker-end="url(#a)"/>
