camera:
  source: android_mjpeg
  url: http://127.0.0.1:8080/video
  device_index: 0
  backend: auto
  width: 640
  height: 480
sam:
  model: sam-3.1
  conf_min: 0.5
  tie_margin: 0.15
  rates_hz: {searching: 2.0, guiding: 0.5, guiding_near: 2.0}
  jpeg_quality: 80
voice:
  model: muse-voice-transcribe-1.0
  mode: ENDPOINTING
  encoding: PCM_16KHZ
  language_bias: [English]
  keywords_file: config/keywords.txt
spark:
  model: muse-spark-1.3
  reasoning_effort: minimal
  image_long_side: 512
audio:
  host_api: auto
  blocksize: 256
  pan_full_dx: 0.4
  pan_deadband: 0.03
  pitch_hz: [220, 880]
  pulse_hz: [2, 12]
  gain: 0.2
tts:
  engine: auto
  rate: 210
contact:
  overlap_min: 0.10
  occlusion_drop: 0.30
  still_ms: 150
  hold_frames: 3
log:
  dir: runs/
  save_frames: true
