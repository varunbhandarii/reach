camera:
  source: android_mjpeg
  url: http://127.0.0.1:8080/video
  device_index: 0
  backend: auto
  width: 640
  height: 480
  ring_depth: 90
  pin_landscape: false
runtime:
  opencv_threads: 1
hand:
  max_hands: 2
  model_path: models/hand_landmarker.task
  confidence: 0.5
  dominant: Right
  hold_ms: 300
  label_vote_frames: 15
  switch_frames: 10
  min_cutoff: 1.0
  beta: 0.01
  derivative_cutoff: 1.0
sam:
  model: sam-3.1
  conf_min: 0.5
  tie_margin: 0.15
  deadline_s: 3.0
  cache: auto
  cache_dir: runs/sam-cache
  rates_hz: {searching: 2.0, guiding: 0.5, guiding_near: 2.0}
  jpeg_quality: 80
objects: [wallet, pen, ball, apple]
motion:
  method: homography
  width: 640
  history: 90
  min_inliers: 15
  appearance_guard: true
brain:
  veto_s: 1.2
  search_prompt_s: 4
  every_s: 6
  give_up_s: 20
  hand_lost_speak_s: 1.5
  target_lost_s: 1.0
  target_lost_speak_s: 2.0
  target_give_up_s: 15
  network_speak_every_s: 15
  readback_wait_s: 2.5
  mismatch_confidence: 0.6
  disambiguate_s: 8
  ask_touch_enabled: false
  ask_touch_s: 1.5
voice:
  model: muse-voice-transcribe-1.0
  mode: ENDPOINTING
  encoding: PCM_24KHZ
  rate: 24000
  frame_ms: 80
  queue_frames: 2
  input_device: null
  fast_stop: true
  rotate_min: 55
  backoff_s: [0.5, 1, 2, 4, 8]
  barge_in: true
  ignore_during_speech: false
  language_bias: [English]
  keywords_file: config/keywords.txt
spark:
  model: muse-spark-1.3
  reasoning_effort: minimal
  image_long_side: 512
audio:
  host_api: auto
  blocksize: 256
  pan_full_dx: 0.4
  pan_deadband: 0.03
  pitch_hz: [220, 880]
  pulse_hz: [2, 12]
  gain: 0.2
tts:
  engine: auto
  rate: 210
  gain: 0.5
  trim_db: -40
contact:
  overlap_min: 0.10
  occlusion_drop: 0.30
  box_grow: 0.20
  min_margin_px: 12
  still_speed: 0.25
  refractory_s: 2.0
  still_ms: 150
  hold_frames: 3
log:
  dir: runs/
  save_frames: true
